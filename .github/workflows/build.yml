name: Build Android APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Build APK
        run: |
          flutter create myapp
          cp lib/main.dart myapp/lib/main.dart
          cd myapp
          flutter pub add shared_preferences intl provider
          flutter build apk --release --no-tree-shake-icons
          cd ..
          mkdir -p output
          cp myapp/build/app/outputs/flutter-apk/app-release.apk output/app-release.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Teacher-App-APK
          path: output/app-release.apk
